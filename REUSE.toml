version = 1

# Bulk annotation for files that cannot or should not carry in-file SPDX
# headers (structured configs, prose, attribution files, lockfiles).
# precedence = "closest" keeps any in-file header authoritative.
[[annotations]]
path = [
    ".fossa.yml",
    ".github/**",
    ".gitignore",
    ".markdownlint.json",
    "AUTHORS",
    "CODE_OF_CONDUCT.md",
    "CONTRIBUTING.md",
    "COPYRIGHT",
    "Makefile",
    "README.md",
    "SECURITY.md",
    "go.mod",
    "go.sum",
]
precedence = "closest"
SPDX-FileCopyrightText = "Copyright (c) 2026 The llingr-logger-zap Authors"
SPDX-License-Identifier = "Apache-2.0"
